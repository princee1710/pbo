<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Retro Login OOP</title>

    <style>
        /* ===== GLOBAL ===== */
        body {
            margin: 0;
            height: 100vh;
            font-family: 'Courier New', monospace;
            background: radial-gradient(circle at top, #2a004f, #000);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #00ffcc;
        }

        /* ===== RETRO GRID ===== */
        body::before {
            content: "";
            position: absolute;
            width: 200%;
            height: 200%;
            background:
                linear-gradient(#00ffcc22 1px, transparent 1px),
                linear-gradient(90deg, #00ffcc22 1px, transparent 1px);
            background-size: 40px 40px;
            transform: rotateX(65deg) translateY(-200px);
            animation: gridMove 15s linear infinite;
        }

        @keyframes gridMove {
            from { transform: rotateX(65deg) translateY(0); }
            to { transform: rotateX(65deg) translateY(400px); }
        }

        /* ===== SCANLINE ===== */
        body::after {
            content: "";
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(
                to bottom,
                rgba(255,255,255,0.03),
                rgba(255,255,255,0.03) 1px,
                transparent 2px,
                transparent 4px
            );
            pointer-events: none;
        }

        /* ===== CONTAINER ===== */
        .container {
            position: relative;
            z-index: 2;
            background: rgba(0, 0, 0, 0.85);
            border: 3px solid #00ffcc;
            padding: 30px;
            width: 340px;
            text-align: center;
            box-shadow: 0 0 25px #00ffcc, inset 0 0 15px #00ffcc55;
            animation: glow 2s infinite alternate;
        }

        @keyframes glow {
            from { box-shadow: 0 0 15px #00ffcc; }
            to { box-shadow: 0 0 30px #ff00ff; }
        }

        .title {
            font-size: 26px;
            margin-bottom: 20px;
            text-shadow: 0 0 15px #00ffcc, 0 0 25px #ff00ff;
        }

        /* ===== INPUT ===== */
        input {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            background: #050505;
            border: 2px solid #00ffcc;
            color: #00ffcc;
            font-family: inherit;
            text-align: center;
        }

        input:focus {
            outline: none;
            box-shadow: 0 0 15px #ff00ff;
        }

        /* ===== BUTTON ===== */
        button {
            width: 95%;
            padding: 14px;
            margin-top: 18px;
            background: linear-gradient(90deg, #00ffcc, #ff00ff);
            color: #000;
            font-weight: bold;
            font-size: 16px;
            border: none;
            cursor: pointer;
            letter-spacing: 2px;
            transition: transform 0.15s ease;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 10px #00ffcc; }
            50% { box-shadow: 0 0 25px #ff00ff; }
            100% { box-shadow: 0 0 10px #00ffcc; }
        }

        button:hover {
            transform: scale(1.05);
        }

        button:active {
            transform: scale(0.92);
            box-shadow: 0 0 30px #fff;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

<!-- ===== LOGIN PAGE ===== -->
<div class="container" id="loginPage">
    <h1 class="title">RETRO LOGIN</h1>
    <input type="text" id="username" placeholder="USERNAME">
    <input type="password" id="password" placeholder="PASSWORD">
    <button id="loginBtn">LOGIN</button>
</div>

<!-- ===== PROFILE PAGE ===== -->
<div class="container hidden" id="profilePage">
    <h1 class="title">PROFILE</h1>
    <p id="welcomeText"></p>
    <button id="logoutBtn">LOGOUT</button>
</div>

<script>
    // ===== CLASS USER =====
    class User {
        constructor(username, password) {
            this.username = username;
            this.password = password;
        }
    }

    // ===== CLASS AUTH =====
    class Auth {
        constructor() {
            this.key = "users_db";
            this.initUser();
        }

        initUser() {
            if (!localStorage.getItem(this.key)) {
                const user = new User("ramdani123", "prince123");
                localStorage.setItem(this.key, JSON.stringify([user]));
            }
        }

        login(username, password) {
            const users = JSON.parse(localStorage.getItem(this.key));
            return users.find(
                u => u.username === username && u.password === password
            );
        }
    }

    // ===== CLASS UI =====
    class UI {
        constructor() {
            this.loginPage = document.getElementById("loginPage");
            this.profilePage = document.getElementById("profilePage");
            this.welcomeText = document.getElementById("welcomeText");
        }

        showProfile(username) {
            this.loginPage.classList.add("hidden");
            this.profilePage.classList.remove("hidden");
            this.welcomeText.innerText = `WELCOME, ${username}`;
        }

        logout() {
            this.profilePage.classList.add("hidden");
            this.loginPage.classList.remove("hidden");
        }
    }

    // ===== OBJECT =====
    const auth = new Auth();
    const ui = new UI();

    // ===== EVENT =====
    document.getElementById("loginBtn").addEventListener("click", () => {
        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;

        const user = auth.login(username, password);
        user ? ui.showProfile(user.username) : alert("PASSWORD SALAH!");
    });

    document.getElementById("logoutBtn").addEventListener("click", () => {
        ui.logout();
    });
</script>

</body>
</html>
